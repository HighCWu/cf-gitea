name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Install once, then the three fast gates: typecheck, lint, unit tests
  # (vitest in workerd with real bindings — @cloudflare/vitest-plugin).
  checks:
    runs-on: ubuntu-latest
    # Wall budget driven by the full-suite composite gate (see the Test step):
    # phase-1 full run ~5-6 min (locally measured 309-319s; CI is not faster —
    # vitest.config.ts pins maxWorkers: 8, so the pool size matches local) +
    # solo adjudication ≈ +10-15 min (up to ~210 death/timeout files, one
    # vitest process each at the measured 5-20s, 4-way concurrency ≈ 11 min at
    # the 2026-10-27 mix). Gate total ~15-25 min; install + wrangler types +
    # icons + typecheck + lint add ~5 min. 45 min is ~1.5-2x headroom, not a
    # tuning knob.
    timeout-minutes: 45
    steps:
      # gitea/ submodule: gen:icons reads the committed octicon svg bodies
      # (SPEC-0008 §2.4.1) to emit the gitignored icons.generated.ts.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Dev vars (test suite authenticates with the dev token)
        run: cp apps/worker/.dev.vars.example apps/worker/.dev.vars
      - name: Generate worker-configuration.d.ts (gitignored, never committed)
        run: pnpm --filter cf-gitea-worker exec wrangler types
      - name: Generate icons.generated.ts (gitignored, SPEC-0008 §2.4.1)
        run: pnpm gen:icons
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      # A plain `vitest run` (pnpm test) is not an honest gate at the ws1009
      # scale: every file whose runner dies at startup to the workerd
      # WebSocket-1009 "Message is too large" pool death never runs, vitest
      # reports it only as unhandled errors and exits 1 — deterministic 204/258
      # files at the 2026-10-27 measurement (mechanism + ledger:
      # docs/testing/suite-stability.md). The deaths are structural, not
      # load-based (the common import graph exceeds the warm-snapshot frame
      # limit; maxWorkers: 8 is pinned in vitest.config.ts, so runner size
      # does not change it), so CI sees the same class. pnpm test:full is the
      # composite gate: phase 1 runs the FULL suite and attributes every file
      # to {ran, died-at-startup, timeout}; the pending set is then adjudicated
      # SOLO — each file in its own vitest process (a fresh process
      # first-connects an empty warm snapshot, the only structural cure; a
      # solo death is retried once, then fails honestly). Verdict PASS only
      # when every file ran green across phases. Scope-identical to the old
      # pnpm test: it covered only apps/worker (the one workspace package
      # with a test script).
      # Flag note: pnpm forwards extra args to the script VERBATIM — no
      # npm-style `--` separator here; the gate's parser rejects a literal
      # `--`. The gate writes its phase logs + raw vitest JSON next to the
      # --baseline-json path (that dir is the artifact uploaded below).
      # The gated suites' guarded arms (UI shell manifest, avatar terminal legs)
      # skip without the built frontend tree — build it so CI exercises them.
      - name: Build frontend assets
        run: pnpm build:assets
      - name: Test (full-suite composite gate — pnpm test:full, solo adjudication)
        run: pnpm test:full --baseline-json .full-suite-gate/full-suite-gate.json
      - name: Upload full-suite gate evidence (baseline JSON + phase logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-gate-evidence
          path: .full-suite-gate/
          if-no-files-found: ignore
      # git-engine tsx checks (packages/git-engine/e2e/, plain Node under the
      # tsx runner, NO dev server — wired 2026-10-28 per the e2e README's
      # "left to the maintainers" note). Each drives the REAL GitStore/control
      # plane over node:sqlite (real BEGIN/COMMIT) or the REAL serve path,
      # with real `git` as the oracle; seconds each (delete-husk boots real
      # miniflare/workerd with restarts and still runs in ~2s). Invocation is
      # the README's pnpm-store shape, NOT `pnpm exec tsx`: tsx is
      # transitive-only in this workspace (no package declares it), so exec
      # cannot resolve it — but a fresh --frozen-lockfile install always lays
      # node_modules/.pnpm/tsx@*/... down (peer of the vite/wrangler chain),
      # which is exactly what the globbed path pins. What each check pins:
      # - check-fault-matrix — SPEC-0011 §7.2 fault-injection completion tail:
      #   a real compaction publish lands MID-STREAM between segment GETs, a
      #   GC pass fully lease-blocks a paced fetch (row 12 early-release
      #   overlap on the same timeline), mid-stream lease expiry rejects the
      #   renewal and abandons the stream, crash-after-publish mid-delete
      #   retries converge on a real publish.
      # - check-push-origin — the onPush event's request-origin channel:
      #   event.origin carries the LIVE request's scheme+authority (port,
      #   https survive) through the real parse/stage/scan/finalize receive
      #   flow, awaited via a collecting ExecutionContext.
      # - check-delete-husk — delete-surface husk semantics pinned on the
      #   REAL dev runtime (miniflare/workerd, NOT node:sqlite): a completed
      #   async purge leaves an empty husk whose engine DELETE answers 200
      #   idempotently across restarts (never the historical SQLITE_LOCKED
      #   500), content-bearing cells still take the real wipe path, and a
      #   fresh session over an existing database can still CREATE/DROP —
      #   the cursor-drain root-cause fix (workerd#959).
      # - check-tree-commits — the listTreeCommits batched per-path
      #   latest-commit RPC is index-aligned equal to the per-path listLog
      #   first commit on a real git fixture tree.
      # - check-drain-discipline — the static tripwire: EVERY SqlStorage
      #   SELECT cursor under engine src/** proves a full drain
      #   (.toArray()/.one()/full iteration), fail-closed statement
      #   classification, and the tripwire self-tests its own mutation class
      #   (the workerd#959 SELECT-cursor-bricks-DDL discipline).
      # - check-capability-matrix — TEST-GENERATED at run time: every
      #   capability advertised by the LIVE handshakes (v0 upload/receive,
      #   protocol v2 advertisement) must map onto a REGISTERED PROOF driving
      #   the real paths; `filter` stays unadvertised-and-rejected; unknown
      #   fetch arguments fail closed.
      # - check-correctness-tier — SPEC-0011 §7.3 correctness tier on the
      #   REAL receive flow: push-boundary trio (under-cap lands; over-cap
      #   DECLARED is a 413 before any write; over-cap UNDECLARED aborts
      #   mid-stream with zero refs moved), newTip-exists-tree-missing
      #   injection, finalize-success-lost retry convergence, cross-pack
      #   delta clone and REF_DELTA incremental fetch (git index-pack/
      #   verify-pack/fsck oracles).
      # The OLDER tsx checks (the second wave, wired 2026-10-28): all 13 ran
      # green locally in this exact shape before landing; the e2e.sh-family
      # harness scripts stay OUT (the e2e job runs those, against a dev
      # server these checks deliberately never need).
      # - check-merge-graph — SPEC-0001b §4.1 graph primitives vs git
      #   merge-base/rev-list oracles: countDivergence/isAncestor(+Ex) on real
      #   DAG fixtures, criss-cross base ∈ merge-base --all and stable,
      #   budget exhaustion propagates, §4.6 read-only snapshot after every
      #   read RPC.
      # - check-merge-tree — SPEC-0001b §4.2 tree merge + diff3 vs git
      #   merge-tree --write-tree / git merge-file: tree-oid equality on clean
      #   merges (canonical ordering), conflicted-path list for all,
      #   byte-exact markers per file, caps report too_large/overflow.
      # - check-merge-engine — SPEC-0001b §4.3-4.5/4.8 merge/rebase RPC
      #   semantics over a real GitStore: rejection postures (conflict,
      #   too_large, overflow) and rebaseOnto's too_many/up_to_date/
      #   invalid-ref arms with its final tree == real git rebase's.
      # - check-deepen-parse — the G1/G4/G5 parse gates over parseUploadRequest:
      #   deepen-family recognition (since/not/shallow), combination safety,
      #   clean protocol-v2 ls-refs ref-prefix parsing (G2's ERR verdicts were
      #   verified against a real git client in the landing report).
      # - check-cache-unreachable — the G3 P0 gate: a poisoned deepen-since
      #   request through the REAL serve fast path makes ZERO planCloneStream
      #   RPCs and zero R2 interactions; the legal full clone is the control
      #   (one plan RPC + one R2 get, inline renewal, release at last read).
      # - check-catalog-rpc — the listPackCatalog RPC over a real GitStore:
      #   keyset pagination (pack_key order, disjoint pages, exhaustion,
      #   past-end cursor), tagged-union error cases, all-states visibility
      #   (superseded rows listed), kind surfacing ('fork'), empty-catalog shape.
      # - check-fork-replicate — SPEC-0001b §5.3 fork-replication gate (M-F3):
      #   the production replicate loop over an in-memory R2 against a REAL
      #   receive-populated parent — git index-pack/fsck/rev-count parity,
      #   in-store reachable-set walk, R2 byte equality, crash-injection
      #   re-run convergence with the crashed state un-servable.
      # - check-read-leases — SPEC-0011 §3 M3.1: atomic plan+lease
      #   (register-after-check closed by rollback), readable-catalog
      #   dependency set, renewal/rejection postures (fault A/C, foreign pack,
      #   unknown plan), release-on-last-read + idempotence + post-release
      #   refusal, fault B restart survival, expiry sweep, DO-arm integration,
      #   fast-path re-framing loop, the real RepoCell RPC surface.
      # - check-segmented-serve — SPEC-0011 §4.1 M3.2: the segmented
      #   union-serve path with the REAL uploadPack DO arm over a range-aware
      #   R2 stub — bounded Range GETs with per-segment confirmed renewals,
      #   lease-before-first-byte on one event timeline, fail-stop rejection,
      #   the unsorted emission path gates its segments too, loose-only
      #   guard-free.
      # - check-compaction — SPEC-0011 §5 M3.3: real runCompaction over a real
      #   GitStore — threshold round, deferred re-arm, stamp consumption,
      #   receive exclusion, §5.3's appended row-4 assertion and the two D3
      #   graceful-failure-exit checks.
      # - check-gc — SPEC-0011 §2 M3.4: real GC pass over a real GitStore + R2
      #   — reclaim eligibility vs live read leases (the §7.1 counter-example:
      #   a reader under lease never sees a deleted pack), gcNow manual
      #   rounds, alarm stamp gating and post-compaction convergence.
      # - check-migrations — SPEC-0011 §8 M3.0: DO SQLite forward migrations —
      #   fresh baseline replay, in-place adoption of a populated 0001a-step4
      #   legacy DB (rows intact), re-run no-op, 0002 exactly-once, loud
      #   fail-closed on unrecognized states, forward-only tripwire, registry
      #   baseline, wipe-path rebuild.
      # - check-validate-push — SPEC-0013 M2: the engine-side validatePush
      #   hook contract over the REAL receive flow — classified commands
      #   (create/fast-forward/force-push/delete via ONE classifyReceive RPC
      #   over lease-staged rows), pusher identity on the hook context,
      #   byte-identical legacy flow when no hook is set.
      # Step budget: all 20 checks measured ~11s wall locally (2026-10-28,
      # sequential fail-fast) — nowhere near a split; the 45-min job cap is
      # dominated by the full-suite gate above, not this step.
      - name: Engine checks (git-engine tsx gates — all 31 e2e check-*.mjs)
        run: |
          TSX=$(ls -d node_modules/.pnpm/tsx@*/node_modules/tsx/dist/cli.mjs | head -1)
          node "$TSX" packages/git-engine/e2e/check-fault-matrix.mjs
          node "$TSX" packages/git-engine/e2e/check-push-origin.mjs
          node "$TSX" packages/git-engine/e2e/check-delete-husk.mjs
          node "$TSX" packages/git-engine/e2e/check-tree-commits.mjs
          node "$TSX" packages/git-engine/e2e/check-drain-discipline.mjs
          node "$TSX" packages/git-engine/e2e/check-capability-matrix.mjs
          node "$TSX" packages/git-engine/e2e/check-receive-caps.mjs
          node "$TSX" packages/git-engine/e2e/check-tag-read.mjs
          node "$TSX" packages/git-engine/e2e/check-archive-attrs.mjs
          node "$TSX" packages/git-engine/e2e/check-protocol-v2-partial.mjs
          node "$TSX" packages/git-engine/e2e/check-correctness-tier.mjs
          node "$TSX" packages/git-engine/e2e/check-merge-graph.mjs
          node "$TSX" packages/git-engine/e2e/check-merge-tree.mjs
          node "$TSX" packages/git-engine/e2e/check-merge-engine.mjs
          node "$TSX" packages/git-engine/e2e/check-deepen-parse.mjs
          node "$TSX" packages/git-engine/e2e/check-cache-unreachable.mjs
          node "$TSX" packages/git-engine/e2e/check-catalog-rpc.mjs
          node "$TSX" packages/git-engine/e2e/check-fork-replicate.mjs
          node "$TSX" packages/git-engine/e2e/check-read-leases.mjs
          node "$TSX" packages/git-engine/e2e/check-segmented-serve.mjs
          node "$TSX" packages/git-engine/e2e/check-compaction.mjs
          node "$TSX" packages/git-engine/e2e/check-gc.mjs
          node "$TSX" packages/git-engine/e2e/check-migrations.mjs
          node "$TSX" packages/git-engine/e2e/check-validate-push.mjs
          node "$TSX" packages/git-engine/e2e/check-grep.mjs
          node "$TSX" packages/git-engine/e2e/check-activity-stats.mjs
          node "$TSX" packages/git-engine/e2e/check-contributor-stats.mjs
          node "$TSX" packages/git-engine/e2e/check-graph.mjs
          node "$TSX" packages/git-engine/e2e/check-lfs-pointers.mjs
          node "$TSX" packages/git-engine/e2e/check-receive-name-bind.mjs
      - name: API contract check (declared routes vs frozen contract, SPEC-0004 §5.1)
        run: pnpm check:api
      - name: "Contract freeze guard (ADR-0002: frozen copy verbatim + sha256)"
        run: pnpm check:contract

  # Real-git end-to-end suite (packages/git-engine/e2e/) against the dev
  # Worker. Sections 8-11 (upstream dgit's web UI) and the section-12
  # "private UI needs auth" probe fail PERMANENTLY by design — not pending a
  # later SPEC: the engine is created `ui: false` (SPEC-0008 gave the page
  # families to the Tier-2 UI router), so the dgit pages these checks scrape
  # 404 for good; and the probe's trailing-slash URL stays on the engine
  # passthrough (SPEC-0008 §4 item 13 — the UI only claims canonical
  # slash-less URLs), where headless pages 404 BEFORE the auth gate, so the
  # dgit 401 is unreachable (full rationale:
  # packages/git-engine/e2e/README.md). CI asserts the failure set stays
  # EXACTLY that documented set: any new failing check fails the build.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen:icons reads committed svg bodies from the gitea/ submodule;
          # required once src/index.ts imports ./ui (predev regenerates).
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate UI icons
        run: pnpm gen:icons
      - name: Dev vars (GIT_TOKEN=devtoken)
        run: cp apps/worker/.dev.vars.example apps/worker/.dev.vars
      # A fresh runner's local D1 is EMPTY: neither `vite dev` nor the
      # @cloudflare/vite-plugin applies D1 migrations (verified in the plugin
      # dist — wrangler.jsonc's migrations_dir is only read by the wrangler
      # CLI, which is exactly what db:migrate:local drives). Without this the
      # FIRST metadata-touching request 500s "no such table": the suite's
      # pre-clean `DELETE demo` 500-fataled at setup (runs 40693290410 and
      # 40695317569), the observed-FAILS file stayed empty and the allowlist
      # check below then failed on set-inequality. Same step the lfs-e2e and
      # mirror-e2e jobs already carry — the only two dev-server jobs that
      # were green.
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      # The e2e harness runs git am/commit flows; the runner's git has NO
      # user identity -> "Patch format detection failed" -> the am-tree check
      # fails (the +1 vs the allowlist, run 40699376701: 36 observed vs 35).
      - name: Git identity (the harness's am/commit flows)
        run: |
          git config --global user.name "cf-gitea-ci"
          git config --global user.email "ci@cf-gitea.invalid"
      - name: Start dev Worker (vite dev, workerd)
        run: |
          # GH runner images alias localhost to ::1 AS WELL as 127.0.0.1
          # (runner-images configure-environment.sh "Add localhost alias to
          # ::1"), so node resolves localhost to IPv6 first and vite binds
          # ::1 ONLY. Polls to 127.0.0.1 then get instant connection-refused
          # forever — misread as a slow workerd boot ("worker silent past the
          # budget"): vite prints ready in ~7-11s, the worker is up on ::1,
          # and the 300s poll still exhausts (attempt tails static at the
          # banner, run 40687228474). Pin the bind family explicitly; the
          # suite/bench/battery clients all talk to 127.0.0.1.
          pnpm dev --host 127.0.0.1 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:5173/healthz > /dev/null; then
              echo "dev server up (attempt $i)"; exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- attempt $i: dev log tail ---"; tail -5 /tmp/dev-server.log
            fi
            sleep 2
          done
          echo "dev server did not come up"
          cat /tmp/dev-server.log
          # If this ever fires again, the socket table shows WHICH family the
          # server bound (the bind-family mismatch class) in the run record.
          echo "--- listen sockets ---"; ss -tln | grep -E ':(5173|5199)' || true
          exit 1
      - name: Run e2e suite
        run: |
          PATH="$PWD/packages/git-engine/e2e/shim:$PATH" \
            packages/git-engine/e2e/e2e.sh http://127.0.0.1:5173/demo devtoken \
            > /tmp/e2e.log 2>&1 || true
          cat /tmp/e2e.log
      - name: Check failures against the documented UI-section allowlist
        run: |
          # observed failures, reduced to check names (drop "(got ... want ...)")
          grep '^FAIL:' /tmp/e2e.log | sed 's/ (got.*//' | sort > /tmp/observed.txt
          cat > /tmp/allowed.txt <<'EOF'
          FAIL: tar.gz extracts
          FAIL: tar.gz content matches v1.0
          FAIL: symlink preserved in tar
          FAIL: zip extracts
          FAIL: zip content matches
          FAIL: git am applies /patch output
          FAIL: am result tree == original commit
          FAIL: git apply accepts /rawdiff output
          FAIL: GET /demo/
          FAIL: GET /demo/about/
          FAIL: GET /demo/refs/
          FAIL: GET /demo/log/
          FAIL: GET /demo/log/?qt=author&q=two
          FAIL: GET /demo/log/?path=docs/guide.txt
          FAIL: GET /demo/tree/
          FAIL: GET /demo/tree/lib/math.js
          FAIL: GET /demo/blame/lib/math.js
          FAIL: GET /demo/commit/
          FAIL: GET /demo/diff/
          FAIL: GET /demo/stats/
          FAIL: GET /demo/stats/?period=w
          FAIL: GET /demo/tag/?h=v1.0
          FAIL: GET /demo/atom/
          FAIL: about renders markdown h1
          FAIL: about renders bold
          FAIL: author search finds commit
          FAIL: path-limited log
          FAIL: syntax highlighting present
          FAIL: blame page has attributions
          FAIL: tag page shows message
          FAIL: atom feed
          FAIL: blob by id
          FAIL: index shows description
          FAIL: old-date-repo age reflects 2010 commit, not push time
          FAIL: private UI needs auth
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          if ! diff -u /tmp/allowed.txt /tmp/observed.txt; then
            echo "::error::e2e failure set diverged from the documented allowlist (packages/git-engine/e2e/README.md)"
            exit 1
          fi
          echo "failure set matches the documented allowlist"

  # Benchmark regression stage (specs/0001-storage-engine.md §9): external
  # metrics (clone MB/s, incremental-fetch ratio, push wall, info/refs p50/p95)
  # for the 5 MiB fixture against the CI-hardware baseline
  # scripts/bench-baselines/ci.json — >10% regression fails the job
  # (scripts/bench-run.mjs). The baseline is self-bootstrapped: the first run
  # after ci.json is absent RECORDS it (report-only pass) and uploads it
  # (artifact bench-ci-baseline) for committing; once committed every run
  # gates CI-vs-CI. NOT --compare m2: m2.json is a dev-box record
  # (bench-run.mjs BASELINE POLICY — baselines are local-vs-local), and a
  # 2-core runner measured against a dev box is machine variance, not
  # regression. Internal metrics (CPU-ms, peak memory, subrequests) stay
  # null until the M2 Step 2 T3 instrumentation. Only the 5 MiB fixture runs
  # here (42 MiB opt-in, 500 MiB never in CI) to keep the job at a few
  # minutes; fixture generation (~1s for 5m) happens on first use since
  # .bench-fixtures/ is gitignored.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Same as e2e: the dev server loads the ui module graph once wired.
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate UI icons
        run: pnpm gen:icons
      - name: Dev vars (GIT_TOKEN=devtoken)
        run: cp apps/worker/.dev.vars.example apps/worker/.dev.vars
      # Same fresh-runner empty-D1 class as the e2e job (comment there): the
      # benchmark's create-by-push of the fixture 500'd "no such table" before
      # any leg ran (runs 40693290410, 40695317569) — the 10% gate never even
      # reached the compare. Migrate first.
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      - name: Start dev Worker (vite dev, workerd)
        run: |
          # GH runner images alias localhost to ::1 AS WELL as 127.0.0.1
          # (runner-images configure-environment.sh "Add localhost alias to
          # ::1"), so node resolves localhost to IPv6 first and vite binds
          # ::1 ONLY. Polls to 127.0.0.1 then get instant connection-refused
          # forever — misread as a slow workerd boot ("worker silent past the
          # budget"): vite prints ready in ~7-11s, the worker is up on ::1,
          # and the 300s poll still exhausts (attempt tails static at the
          # banner, run 40687228474). Pin the bind family explicitly; the
          # suite/bench/battery clients all talk to 127.0.0.1.
          pnpm dev --host 127.0.0.1 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:5173/healthz > /dev/null; then
              echo "dev server up (attempt $i)"; exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- attempt $i: dev log tail ---"; tail -5 /tmp/dev-server.log
            fi
            sleep 2
          done
          echo "dev server did not come up"
          cat /tmp/dev-server.log
          # If this ever fires again, the socket table shows WHICH family the
          # server bound (the bind-family mismatch class) in the run record.
          echo "--- listen sockets ---"; ss -tln | grep -E ':(5173|5199)' || true
          exit 1
      # Machine-relative trap, fixed 2026-10-28: `--compare m2` measured CI's
      # 2-core runner against a DEV-BOX record (m2.json, 2026-10-24) —
      # bench-run.mjs's BASELINE POLICY itself says baselines compare
      # local-vs-local, and "local" means the machine that recorded the file.
      # The gate therefore bootstraps its own CI-hardware baseline
      # (scripts/bench-baselines/ci.json): the first run RECORDS it (passes;
      # upload below) and every run after it COMPARES — the enforced >10%
      # gate, CI-vs-CI, no machine multiplier and no skipping (SPEC-0001 §9
      # requires the stage; skipping it would leave the primary deployment
      # platform unmeasured).
      - name: Benchmark (CI-hardware baseline; 10% regression gate once recorded)
        run: |
          if [ -f scripts/bench-baselines/ci.json ]; then
            node scripts/bench-run.mjs --compare ci --sizes 5m --base-url http://127.0.0.1:5173
          else
            echo "scripts/bench-baselines/ci.json absent — recording the CI-hardware baseline (report run; the gate arms once it is committed)"
            node scripts/bench-run.mjs --record ci --sizes 5m --base-url http://127.0.0.1:5173
            echo "::notice::scripts/bench-baselines/ci.json recorded — commit it from artifact bench-ci-baseline so the next run gates"
          fi
      - name: Upload recorded CI baseline (first-run bootstrap)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci-baseline
          path: scripts/bench-baselines/ci.json
          if-no-files-found: ignore
      - name: Upload benchmark results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: .bench-results/
          if-no-files-found: ignore

  # UI assets build determinism + submodule hygiene (SPEC-0008 §2.3.1/§5.4;
  # U1 "CI ordering", formal guard lands with U5). Two full builds must emit
  # byte-identical Vite manifests, and the gitea/ submodule must stay pristine
  # (the build runs in a scratch dir — AGENTS.md submodule hygiene rule).
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build assets (pass 1)
        run: pnpm build:assets
      - name: Record manifest + submodule state
        run: |
          cp apps/worker/public/assets/.vite/manifest.json /tmp/manifest-1.json
          test -z "$(git -C gitea status --porcelain)" || {
            echo "::error::gitea/ submodule dirty after asset build"; git -C gitea status --short; exit 1; }
      - name: Build assets (pass 2, scratch rebuild)
        run: pnpm build:assets
      - name: Manifests must be byte-identical
        run: cmp /tmp/manifest-1.json apps/worker/public/assets/.vite/manifest.json

  # git-lfs client e2e suite (scripts/lfs-e2e.sh, SPEC-0006 §5 black-box
  # layer): the REAL git-lfs client against the dev Worker, fully green gate
  # (no allowlist — unlike the e2e job every check must pass). All traffic
  # runs in relay mode (SPEC-0006 §2.3) — local dev has no R2 S3 credentials
  # — so no cloud secrets are needed and the job stays a cheap local run.
  # The suite asserts local D1 state (the `lfs_objects` table of migration
  # 0005) and the local R2 object through the wrangler CLI, hence
  # db:migrate:local before the server starts. git-lfs install: apt-get per
  # scripts/lfs-e2e.README.md's suggested job (ubuntu-latest already carries
  # a git-lfs; the official git-lfs/setup-git-lfs action would pin upstream
  # releases if the distro version ever lags behind the >=3 requirement).
  lfs-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen:icons reads committed svg bodies from the gitea/ submodule
          # (same as the e2e job).
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install git-lfs (the real client, >= 3)
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
      - name: git lfs install
        run: git lfs install
      - name: Generate UI icons
        run: pnpm gen:icons
      # Not covered by pnpm test:lfs — pnpm pre-hooks match exact script
      # names, so `pretest` fires only for `pnpm test` (and predev already
      # regenerates for the dev server); explicit here like the e2e job.
      - name: Dev vars (wrangler.jsonc requires the GIT_TOKEN secret locally)
        run: cp apps/worker/.dev.vars.example apps/worker/.dev.vars
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      - name: Start dev Worker (vite dev, workerd)
        run: |
          # GH runner images alias localhost to ::1 AS WELL as 127.0.0.1
          # (runner-images configure-environment.sh "Add localhost alias to
          # ::1"), so node resolves localhost to IPv6 first and vite binds
          # ::1 ONLY. Polls to 127.0.0.1 then get instant connection-refused
          # forever — misread as a slow workerd boot ("worker silent past the
          # budget"): vite prints ready in ~7-11s, the worker is up on ::1,
          # and the 300s poll still exhausts (attempt tails static at the
          # banner, run 40687228474). Pin the bind family explicitly; the
          # suite/bench/battery clients all talk to 127.0.0.1.
          pnpm dev --host 127.0.0.1 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:5173/healthz > /dev/null; then
              echo "dev server up (attempt $i)"; exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- attempt $i: dev log tail ---"; tail -5 /tmp/dev-server.log
            fi
            sleep 2
          done
          echo "dev server did not come up"
          cat /tmp/dev-server.log
          # If this ever fires again, the socket table shows WHICH family the
          # server bound (the bind-family mismatch class) in the run record.
          echo "--- listen sockets ---"; ss -tln | grep -E ':(5173|5199)' || true
          exit 1
      - name: Run LFS e2e suite
        run: |
          rc=0
          pnpm test:lfs > /tmp/lfs-e2e.log 2>&1 || rc=$?
          cat /tmp/lfs-e2e.log
          exit $rc
      # A red run deliberately leaves its fixtures in place for debugging
      # (scripts/lfs-e2e.README.md): scratch dir /tmp/cgit-lfs-e2e.XXXXXX
      # (its RESULT line names it) holds GIT_TRACE captures, push output and
      # the suite's dev-server.log. Upload it so the failure is diagnosable.
      # The e2e PAT in the traces is runner-local only (minted for the
      # lfse2e fixture user against the ephemeral local D1).
      - name: Upload suite scratch (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lfs-e2e-failure
          path: |
            /tmp/lfs-e2e.log
            /tmp/dev-server.log
            /tmp/cgit-lfs-e2e.*/**
          if-no-files-found: ignore

  # Pull-mirror e2e suite (scripts/mirror-e2e.sh, SPEC-0009 §5 black-box
  # layer): real git clients where the SOURCE side is a loopback smart-HTTP
  # fixture (per-run throwaway CA + leaf, git upload-pack --stateless-rpc)
  # and the TARGET side is the Worker's own git + API surface. Fully
  # self-contained — NO GitHub secrets: the .dev.vars values are CI-local
  # generated throwaways (recipe: scripts/mirror-e2e.README.md § "Dev
  # environment contract"; the names are declared in wrangler.jsonc
  # secrets.required and the suite preflights both sides of that contract).
  # The suite starts AND kills its own dev server — with SSL_CERT_FILE
  # pointed at the fixture CA so workerd's outbound fetch trusts the
  # fixture's TLS — plus the fixture itself, and cleans up on a green run,
  # so the job needs no wait-on step. db:migrate:local first because the
  # suite introspects the local D1 `repo_mirrors` table (migration 0010)
  # through the wrangler CLI, like the lfs-e2e job. The suite runs ~2.5-4
  # min locally; the timeout is generous headroom, not a tuning knob.
  mirror-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Same as e2e: the suite's dev server (pnpm dev, whose predev
          # regenerates icons) loads the ui module graph from gitea/.
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate UI icons
        run: pnpm gen:icons
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      # Values are per-run CI-local throwaways, NOT secrets: GIT_TOKEN only
      # satisfies wrangler.jsonc's secrets.required, the allow entry is the
      # fixture's loopback address (SRC_PORT default 8443), and the KEK is
      # any 32 base64 bytes (AES-256-GCM) — README § "Suggested CI job"
      # blesses `openssl rand -base64 32` fresh per CI run.
      - name: Dev vars (CI-local generated values, per scripts/mirror-e2e.README.md)
        run: |
          cat > apps/worker/.dev.vars <<EOF
          GIT_TOKEN=$(openssl rand -hex 32)
          MIRROR_ALLOWED_HOST_LIST=127.0.0.1:8443
          MIRROR_CREDENTIAL_KEY=$(openssl rand -base64 32)
          EOF
      - name: Run mirror e2e suite
        run: |
          rc=0
          bash scripts/mirror-e2e.sh > /tmp/mirror-e2e.log 2>&1 || rc=$?
          cat /tmp/mirror-e2e.log
          exit $rc
      # A red run deliberately leaves its fixtures in place for debugging
      # (scripts/mirror-e2e.README.md): scratch dir /tmp/cgit-mirror-e2e.XXXXXX
      # (named in the RESULT line) holds the fixture TLS identity and the
      # suite's server log. Upload it so the failure is diagnosable — all
      # values in the traces are CI-local generated throwaways.
      - name: Upload suite scratch (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-e2e-failure
          path: |
            /tmp/mirror-e2e.log
            /tmp/cgit-mirror-e2e.*/**
          if-no-files-found: ignore

  # Differential battery, ours-only (scripts/diff-cases/README.md § Running):
  # scripts/diff-test.mjs against the dev Worker ALONE — no --theirs (the
  # README records the 2026-10-25 attempt: no egress to gitea.com and no
  # token, so the theirs run stays a local, manual affair). The battery
  # enforces its own declared rules (scripts/diff-cases/rules.mjs) and exits
  # "0 iff every case outcome is in {ok, clean-reject, shallow-ok}" — the
  # exit code is the whole gate, no allowlist (unlike the e2e job).
  diff-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Same as e2e: the dev server loads the ui module graph (predev
          # regenerates icons; the explicit step below keeps the e2e ordering).
          submodules: recursive
      # wrangler.jsonc is gitignored (example-file model) — restore it from
      # the committed template so wrangler types / vite tests / dev can read it.
      - name: Wrangler config from example
        run: cp apps/worker/wrangler.jsonc.example apps/worker/wrangler.jsonc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate UI icons
        run: pnpm gen:icons
      - name: Dev vars (CI-local generated GIT_TOKEN, exported for the battery)
        run: |
          GIT_TOKEN=$(openssl rand -hex 32)
          printf 'GIT_TOKEN=%s\n' "$GIT_TOKEN" > apps/worker/.dev.vars
          echo "GIT_TOKEN=$GIT_TOKEN" >> "$GITHUB_ENV"
      # Same fresh-runner empty-D1 class as the e2e job (comment there): the
      # battery's setup creates its repos through the admin API, so on the
      # unmigrated DB every case 500'd at setup within ~200ms — 20/20
      # setup-fail (runs 40693290410, 40695317569). Migrate first.
      - name: Apply local D1 migrations
        run: pnpm db:migrate:local
      - name: Start dev Worker (vite dev, workerd)
        run: |
          # GH runner images alias localhost to ::1 AS WELL as 127.0.0.1
          # (runner-images configure-environment.sh "Add localhost alias to
          # ::1"), so node resolves localhost to IPv6 first and vite binds
          # ::1 ONLY. Polls to 127.0.0.1 then get instant connection-refused
          # forever — misread as a slow workerd boot ("worker silent past the
          # budget"): vite prints ready in ~7-11s, the worker is up on ::1,
          # and the 300s poll still exhausts (attempt tails static at the
          # banner, run 40687228474). Pin the bind family explicitly; the
          # suite/bench/battery clients all talk to 127.0.0.1.
          pnpm dev --host 127.0.0.1 > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
          for i in $(seq 1 150); do
            if curl -sf http://127.0.0.1:5173/healthz > /dev/null; then
              echo "dev server up (attempt $i)"; exit 0
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- attempt $i: dev log tail ---"; tail -5 /tmp/dev-server.log
            fi
            sleep 2
          done
          echo "dev server did not come up"
          cat /tmp/dev-server.log
          # If this ever fires again, the socket table shows WHICH family the
          # server bound (the bind-family mismatch class) in the run record.
          echo "--- listen sockets ---"; ss -tln | grep -E ':(5173|5199)' || true
          exit 1
      - name: Run differential battery (ours-only; exit code is the gate)
        run: node scripts/diff-test.mjs --ours http://127.0.0.1:5173 --token "$GIT_TOKEN"
      - name: Stop dev Worker
        if: always()
        run: kill "$(cat /tmp/dev-server.pid)" 2>/dev/null || true
