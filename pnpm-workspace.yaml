packages:
  - "apps/*"
  - "packages/*"

# Dependencies whose postinstall scripts must run (native binaries: esbuild,
# workerd). pnpm 10+ blocks dependency build scripts unless explicitly allowed
# (pnpm 12: `allowBuilds` map; strictDepBuilds fails the install otherwise).
allowBuilds:
  esbuild: true
  workerd: true

# @cloudflare/vitest-pool-workers@0.23.0 pins an older miniflare alpha whose
# bundled workerd cannot run the project's compatibility_date. Pin every
# miniflare consumer to the exact version wrangler 4.153.x itself pairs with,
# so `vite dev`, `vite build`, and `vitest` all run the same runtime.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261027.1"

overrides:
  miniflare: 5.20261023.0-beta
